{% extends "layout.html" %}
{# Centered layout for pages shown before sign-in (sign-in, two-factor, invitation) and for error pages. #}
{% block body %}
<main id="main" tabindex="-1" class="mx-auto w-full max-w-md px-4 py-10 sm:py-16">
  <div class="mb-8 flex justify-center"><img src="{{ url_for('static', filename='brand/gaprism-logo-stacked-color.svg') }}" width="176" height="131" alt="{{ _('Gaprism') }}"></div>
  <div class="panel p-6 sm:p-8">
    {% include 'components/flashes.html' %}
    {% block content %}{% endblock %}
  </div>
</main>
{% endblock %}
