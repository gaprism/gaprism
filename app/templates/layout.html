<!doctype html>
<html lang="{{ locale }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ _('Technical due diligence') }}{% endblock %} · {{ _('Gaprism') }}</title>
<meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false,"historyCacheSize":0,"selfRequestsOnly":true}'>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<script src="{{ url_for('static', filename='js/htmx.min.js') }}" defer></script>
{% block head %}{% endblock %}
</head>
<body hx-history="false" hx-headers='{"X-CSRFToken": "{{ csrf_token() }}"}'>
<a class="skip" href="#main">{{ _('Skip to content') }}</a>
{% block body %}{% endblock %}
</body>
</html>
