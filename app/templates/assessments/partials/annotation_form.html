<div id="annotation-container-{{ finding.id }}" class="mt-2.5 p-3 bg-slate-50 rounded border border-slate-200">
    <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold text-slate-800">Analyst Technical Annotation</span>
        {% if annotation %}
        <span class="text-[10px] text-slate-500 font-mono">v{{ annotation.version_id }} &bull; Modified {{ annotation.updated_at.strftime('%Y-%m-%d %H:%M') }}</span>
        {% endif %}
    </div>

    {% if conflict_error %}
    <div class="mb-2.5 p-2 rounded bg-rose-50 border border-rose-200 text-rose-800 text-xs">
        <strong>Conflict (409):</strong> {{ conflict_error }} Please reload or review current version before submitting.
    </div>
    {% endif %}

    <form hx-post="{{ url_for('assessments.annotate_finding', id=assessment.id, finding_id=finding.id) }}"
          hx-target="#annotation-container-{{ finding.id }}"
          hx-swap="outerHTML"
          class="space-y-2.5">
        
        <input type="hidden" name="version_id" value="{{ annotation.version_id if annotation else 1 }}">

        <div>
            <label for="justification-{{ finding.id }}" class="block text-xs font-medium text-slate-600 mb-1">
                Technical Justification / Context
            </label>
            <textarea id="justification-{{ finding.id }}"
                      name="justification"
                      rows="2"
                      required
                      class="w-full text-xs rounded-md bg-white border border-slate-300 text-slate-900 placeholder-slate-400 focus:border-teal-700 focus:ring-teal-700 p-2"
                      placeholder="Explain attribution context or false positive rationale...">{{ annotation.justification if annotation else '' }}</textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            <div>
                <label for="revised_severity-{{ finding.id }}" class="block text-xs font-medium text-slate-600 mb-1">
                    Revised Severity (Optional)
                </label>
                <select id="revised_severity-{{ finding.id }}"
                        name="revised_severity"
                        class="w-full text-xs rounded-md bg-white border border-slate-300 text-slate-800 focus:border-teal-700 focus:ring-teal-700 p-1.5">
                    <option value="" {% if not annotation or not annotation.revised_severity %}selected{% endif %}>Keep original ({{ finding.severity }})</option>
                    <option value="informational" {% if annotation and annotation.revised_severity == 'informational' %}selected{% endif %}>Informational</option>
                    <option value="low" {% if annotation and annotation.revised_severity == 'low' %}selected{% endif %}>Low</option>
                    <option value="medium" {% if annotation and annotation.revised_severity == 'medium' %}selected{% endif %}>Medium</option>
                    <option value="high" {% if annotation and annotation.revised_severity == 'high' %}selected{% endif %}>High</option>
                    <option value="critical" {% if annotation and annotation.revised_severity == 'critical' %}selected{% endif %}>Critical</option>
                </select>
            </div>

            <div class="flex items-center pt-4">
                <input id="is_false_positive-{{ finding.id }}"
                       name="is_false_positive"
                       type="checkbox"
                       value="true"
                       {% if annotation and annotation.is_false_positive %}checked{% endif %}
                       class="h-4 w-4 rounded bg-white border-slate-300 text-teal-700 focus:ring-teal-700">
                <label for="is_false_positive-{{ finding.id }}" class="ml-2 text-xs font-medium text-slate-700">
                    Flag as False Positive
                </label>
            </div>
        </div>

        <div class="flex justify-end pt-1">
            <button type="submit"
                    class="px-3 py-1.5 text-xs font-medium rounded-md text-white bg-teal-700 hover:bg-teal-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-700 shadow-sm">
                Save Annotation
            </button>
        </div>
    </form>
</div>
