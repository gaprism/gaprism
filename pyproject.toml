[project]
name = "gaprism"
version = "0.1.0"
description = "Technical due diligence from a single pane of glass"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
# What the code imports is declared here, and nothing else (a test of the lock keeps it that way:
# tests/test_dependencies.py). A few are needed without being imported; the comments say why.
dependencies = [
    "Flask>=3.0.0",
    "Werkzeug>=3.0.0",
    "click>=8.1.0",
    "Flask-SQLAlchemy>=3.1.0",
    "SQLAlchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",  # the driver of postgresql+psycopg:// URLs
    "Flask-Migrate>=4.0.0",
    "alembic>=1.13.0",
    "Flask-Security-Too>=5.3.0",
    "Flask-Login>=0.6.2",
    "Flask-WTF>=1.2.0",
    "WTForms>=3.1.0",
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",  # the password hash Flask-Security is configured with
    "qrcode>=7.4.0",  # Flask-Security refuses to start with two-factor on and no qrcode
    "httpx>=0.27.0",
    "dnspython>=2.6.0",
    "publicsuffixlist>=1.0.0",
    "maxminddb>=2.6.0",
    "babel>=2.14.0",
    "python-dotenv>=1.0.0",  # `flask` loads .env with it (the non-Docker way to configure)
]

[project.optional-dependencies]
# Screenshots and the browser-based checks are not built yet; the extra only prepares them.
screenshots = ["playwright>=1.40.0"]

[dependency-groups]
deploy = [
    "gunicorn>=26.2",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pip-audit>=2.7.0",
    "mmdb-writer>=0.2.7",  # the tests build small IP databases with it
    "netaddr>=1.0.0",  # ... and import it themselves (mmdb-writer needs it too)
    "pyotp>=2.9.0",  # tests/auth/test_mfa.py makes the codes of an authenticator
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic scripts are generated and frozen; archived docs hold historical code.
extend-exclude = ["migrations/versions", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "RUF", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Placeholder secrets for development and tests; validate_config() rejects them in production.
"app/config.py" = ["S105"]
# Tests use asserts, fixture secrets, "0.0.0.0" literals and subprocess probes by design.
"tests/**" = ["S101", "S104", "S105", "S106", "S110", "S603"]

[tool.ruff.lint.isort]
known-first-party = ["app", "runner"]

[tool.mypy]
python_version = "3.11"
files = ["app", "runner"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true

# Strict where the security-relevant and business logic lives.
[[tool.mypy.overrides]]
module = ["runner.*", "app.checks.*", "app.service.*", "app.rules.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "flask_login",
    "flask_security.*",
    "flask_migrate",
    "flask_wtf.*",
    "wtforms.*",
    "publicsuffixlist",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q -ra --strict-markers -m 'not live'"
markers = [
    "live: needs the real network; deselected by default (run with -m live)",
]
