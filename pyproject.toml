[project]
name = "web-due-diligence"
version = "0.1.0"
description = "SaaS Technical Due Diligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "SQLAlchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "Flask-Migrate>=4.0.0",
    "alembic>=1.13.0",
    "Flask-Security-Too>=5.3.0",
    "Flask-WTF>=1.2.0",
    "cryptography>=42.0.0",
    "bcrypt>=4.1.0",
    "argon2-cffi>=23.1.0",
    "pyotp>=2.9.0",
    "qrcode>=7.4.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "jinja2>=3.1.0",
    "babel>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-playwright>=0.4.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "testcontainers[postgres]>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app", "runner"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "flask_security.*",
    "flask_migrate.*",
    "flask_wtf.*",
    "testcontainers.*",
    "playwright.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v"
